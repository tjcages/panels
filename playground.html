<!doctype html>
<meta charset="utf-8" />
<title>float harness</title>
<style>
  body { margin: 0; min-height: 200vh; background: #f0ede6; font-family: sans-serif; }
  main { padding: 48px; }
</style>
<script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.2.0",
      "react-dom": "https://esm.sh/react-dom@19.2.0",
      "react-dom/client": "https://esm.sh/react-dom@19.2.0/client",
      "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
      "mediabunny": "https://esm.sh/mediabunny@1.50.7"
    }
  }
</script>
<main><h1>Float harness</h1><p>Panel should float, drag, dock, resize.</p></main>
<div id="root"></div>
<script type="module">
  import { createElement as h, useState } from "react"
  import { createRoot } from "react-dom/client"
  import { FloatingPanel } from "./dist/index.js"

  function App() {
    const [collapsed, setCollapsed] = useState(false)
    window.__setCollapsed = setCollapsed
    return h(
      FloatingPanel,
      {
        side: "right",
        collapsed,
        onToggle: () => setCollapsed(c => !c),
        title: "Float test",
        float: true,
        floatStorageKey: "harness",
        showThemeToggle: false,
      },
      h("div", { style: { padding: 12, color: "inherit" } },
        Array.from({ length: 30 }, (_, i) => h("p", { key: i }, `row ${i}`)))
    )
  }
  createRoot(document.getElementById("root")).render(h(App))
</script>
